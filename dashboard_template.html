<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harcamalarım</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f1ec;--bg2:#ece8e1;--card:#fffdfa;--card2:#f4f0ea;--hover:rgba(30,20,50,.05);
  --line:rgba(30,20,50,.09);--line2:rgba(30,20,50,.16);
  --ink:#1b1524;--ink2:#4d4658;--muted:#8a8295;
  --accent:#f0602a;--accent2:#e02f6e;--accent3:#8a4dff;
  --grad:linear-gradient(125deg,#ff9a3d 0%,#ff3d81 52%,#8a4dff 100%);
  --good:#0e9f63;--bad:#e1335a;--warn:#d58600;
  --glowA:rgba(255,138,61,.22);--glowB:rgba(138,77,255,.16);
  --shadow:0 18px 40px -18px rgba(40,20,60,.28);--tipbg:#1b1524;--tipink:#fff;
  --heat0:#efe9e1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0c0b10;--bg2:#111017;--card:#16151d;--card2:#1e1c27;--hover:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#f5f2fa;--ink2:#bdb6cb;--muted:#7f7891;
  --accent:#ff7a45;--accent2:#ff3d81;--accent3:#a26bff;
  --good:#3ddc97;--bad:#ff5c7a;--warn:#ffb020;
  --glowA:rgba(255,122,69,.20);--glowB:rgba(162,107,255,.18);
  --shadow:0 18px 50px -20px rgba(0,0,0,.8);--tipbg:#f5f2fa;--tipink:#16151d;
  --heat0:#1f1d29;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0b10;--bg2:#111017;--card:#16151d;--card2:#1e1c27;--hover:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#f5f2fa;--ink2:#bdb6cb;--muted:#7f7891;
  --accent:#ff7a45;--accent2:#ff3d81;--accent3:#a26bff;
  --good:#3ddc97;--bad:#ff5c7a;--warn:#ffb020;
  --glowA:rgba(255,122,69,.20);--glowB:rgba(162,107,255,.18);
  --shadow:0 18px 50px -20px rgba(0,0,0,.8);--tipbg:#f5f2fa;--tipink:#16151d;
  --heat0:#1f1d29;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.num,.big,.kpi .v,.hval,td.num{font-variant-numeric:tabular-nums}
.display{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}

/* ── shell ── */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:20px 14px 16px;
  background:var(--bg2);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand .mark{width:34px;height:34px;border-radius:11px;background:var(--grad);flex:none;position:relative;
  box-shadow:0 8px 22px -8px var(--accent2)}
.brand .mark::after{content:"₺";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.brand b{display:block;font-size:16.5px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;color:var(--ink2);text-decoration:none;
  font-weight:550;font-size:13.5px;transition:background .15s,color .15s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 6px 18px -12px rgba(0,0,0,.5)}
.nav a.on svg{color:var(--accent);opacity:1}
.nav .count{margin-left:auto;background:var(--accent2);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:0 4px}
.themebtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:12px;
  padding:8px 11px;cursor:pointer;color:var(--ink2);font-size:13px}
.themebtn:hover{color:var(--ink)}
.privacy{font-size:11.5px;color:var(--muted);line-height:1.4}
.privacy b{color:var(--ink2);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.live{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}

main{min-width:0;padding:0 30px 64px}
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:18px 0 14px;margin-bottom:22px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.tb-title h1{margin:0;font-size:25px;font-weight:720;letter-spacing:-.025em}
.tb-sub{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cov{display:inline-flex;align-items:center;gap:7px}
.cov .bar{width:64px;height:6px;border-radius:9px;background:var(--line2);overflow:hidden}
.cov .bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.period{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:3px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px}
.pills button{border:0;background:none;color:var(--ink2);padding:6px 11px;border-radius:10px;cursor:pointer;font-weight:560;font-size:12.5px;white-space:nowrap}
.pills button:hover{background:var(--hover);color:var(--ink)}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=search],input[type=text],input[type=number],input:not([type]){background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.clamp{font-size:12px;color:var(--warn)}

/* ── grid & cards ── */
.page{display:none}
.page.on{display:block;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;min-width:0;position:relative}
.card>h3{margin:0;font-size:14.5px;font-weight:680;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card>h3 .tag{margin-left:auto}
.hint{color:var(--muted);font-size:12.5px;margin:3px 0 14px}
.empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}

/* hero */
.hero{overflow:hidden;background:radial-gradient(120% 130% at 0% 0%,var(--glowA),transparent 58%),radial-gradient(100% 120% at 100% 100%,var(--glowB),transparent 62%),var(--card)}
.eyebrow{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.big{font-size:clamp(40px,5.2vw,60px);font-weight:760;letter-spacing:-.04em;line-height:1.02;margin:10px 0 6px}
.big small{font-size:.45em;font-weight:650;color:var(--ink2);letter-spacing:0;margin-left:4px}
.hero-sub{color:var(--ink2);font-size:13px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.delta.up{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.delta.down{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.delta.flat{color:var(--ink2);background:var(--card2)}
.hero-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dna{display:flex;gap:3px;height:14px;margin:22px 0 10px}
.dna i{display:block;height:100%;border-radius:4px;min-width:3px;transition:filter .15s}
.dna i:hover{filter:brightness(1.15)}
.dna-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.dna-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.kpi .l{color:var(--ink2);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .l .ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--card2)}
.kpi .v{font-size:28px;font-weight:740;letter-spacing:-.03em;margin-top:8px;line-height:1.1}
.kpi .s{color:var(--muted);font-size:12px}
.kpi .viz{position:absolute;right:14px;bottom:12px;opacity:.95}
.kpi.has-viz .s{max-width:58%}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
.strip>div{padding:4px 16px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0;padding-left:0}
.strip .l{font-size:12px;color:var(--muted);font-weight:600}
.strip .v{font-size:19px;font-weight:720;letter-spacing:-.02em;margin:2px 0}
.strip .s{font-size:11.5px;color:var(--muted)}

/* alerts & insights */
.alerts{display:grid;gap:8px;margin-bottom:16px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:13px;color:var(--ink2)}
.alert b{color:var(--ink)}
.alert .ic{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.alert.critical .ic{background:var(--bad)} .alert.warning .ic{background:var(--warn)} .alert.info .ic{background:var(--accent3)}
.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ins{border-radius:16px;padding:14px 15px;background:var(--card2);border:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.ins .e{font-size:22px;line-height:1;flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card)}
.ins b{display:block;font-size:13.5px;margin-bottom:2px;letter-spacing:-.005em}
.ins p{margin:0;font-size:12.5px;color:var(--ink2)}
.ins.good .e{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--good) 55%,transparent)}
.ins.bad .e{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 55%,transparent)}

/* charts */
svg text{font-family:inherit}
.tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.gridl{stroke:var(--line);stroke-width:1} .axis{stroke:var(--line2);stroke-width:1}
.vlabel{fill:var(--ink);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.hit{fill:transparent;outline:none;cursor:default}
.chart svg{display:block;overflow:visible}
.dim .seg{opacity:.28;transition:opacity .15s} .dim .seg.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hatch{background:repeating-linear-gradient(135deg,var(--line2) 0 2px,transparent 2px 5px)!important}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap .lg{flex:1;min-width:180px;display:grid;gap:3px}
.lgrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;font-size:12.5px;padding:4px 6px;border-radius:8px;cursor:pointer}
.lgrow:hover,.lgrow.on{background:var(--hover)}
.lgrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.lgrow .p{color:var(--muted);font-size:11.5px}
.hlist{display:grid;gap:4px}
.hrow{display:grid;grid-template-columns:30px minmax(80px,34%) 1fr 92px;gap:10px;align-items:center;padding:5px 6px;border-radius:10px}
.hrow.noav{grid-template-columns:minmax(90px,38%) 1fr 92px}
.hrow[role=button]{cursor:pointer}
.hrow[role=button]:hover,.hrow.sel{background:var(--hover)}
.hlabel{min-width:0}
.hlabel .n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:560}
.hlabel .m{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;color:var(--muted)}
.htrack{position:relative;height:10px;border-radius:99px;background:var(--card2)}
.hfill{position:absolute;top:0;height:10px;border-radius:99px}
.hmark{position:absolute;top:-4px;width:2px;height:18px;border-radius:2px;background:var(--ink)}
.hval{text-align:right;font-size:13px;font-weight:600}
.av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#17121f;flex:none;letter-spacing:-.02em}
.av.emoji{font-size:16px;background:var(--card2)!important}
.tm{position:relative;height:330px;border-radius:14px;overflow:hidden}
.tm .t{position:absolute;padding:10px 11px;color:#17121f;overflow:hidden;cursor:pointer;border:2px solid var(--card);border-radius:12px;transition:filter .15s}
.tm .t:hover{filter:brightness(1.08) saturate(1.1)}
.tm .t.sel{outline:3px solid var(--ink);outline-offset:-3px}
.tm .t b{display:block;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .t span{font-size:12px;opacity:.8;font-weight:600}
.tm .t .e{font-size:20px;display:block;margin-bottom:4px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
.catc{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;cursor:pointer;transition:transform .15s,border-color .15s}
.catc:hover{transform:translateY(-2px);border-color:var(--line2)}
.catc.sel{border-color:var(--ink)}
.catc .top{display:flex;align-items:center;gap:10px}
.catc .top .n{font-weight:650;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catc .amt{font-size:21px;font-weight:740;letter-spacing:-.02em}
.catc .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.pbar{height:7px;border-radius:9px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:9px}
.small{font-size:12px;color:var(--muted)}
.cal{display:flex;flex-wrap:wrap;gap:22px}
.calm h4{margin:0 0 8px;font-size:12.5px;font-weight:650;color:var(--ink2)}
.calg{display:grid;grid-template-rows:repeat(7,var(--cs,18px));grid-auto-flow:column;grid-auto-columns:var(--cs,18px);gap:4px}
.hc{border-radius:5px;background:var(--heat0);cursor:pointer;position:relative}
.hc.blank{background:none;cursor:default}
.hc span{position:absolute;left:6px;top:4px;font-size:10.5px;font-weight:650;color:var(--ink);opacity:.7}
.hc.trip{box-shadow:inset 0 0 0 2px #22D3EE}
.hc.sel{outline:2px solid var(--ink);outline-offset:1px}
.hc:hover{outline:2px solid var(--line2)}
.wdl{display:grid;grid-template-rows:repeat(7,var(--cs,18px));gap:4px;font-size:10px;color:var(--muted);padding-top:25px;margin-right:-12px}
.wdl span{line-height:var(--cs,18px)}
.heatkey{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:12px}
.heatkey i{width:14px;height:14px;border-radius:4px;display:inline-block}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cc{border-radius:20px;padding:18px 20px;color:#fff;min-height:170px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.cc::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.09)}
.cc::before{content:"";position:absolute;right:30px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.cc .bank{font-weight:700;font-size:14px;opacity:.95}
.cc .no{font-family:ui-monospace,Consolas,monospace;letter-spacing:.14em;opacity:.85;font-size:13px;margin-top:2px}
.cc .amt{font-size:28px;font-weight:760;letter-spacing:-.03em;margin-top:auto}
.cc .meta{display:flex;justify-content:space-between;font-size:12px;opacity:.88;margin-top:4px;gap:8px;position:relative;z-index:1}
.cc .chip{width:36px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f5d77a,#c9a13a);position:absolute;right:20px;top:20px;z-index:1}
.acct{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.acct b{display:block}
.pill-good,.pill-bad,.pill-warn,.pill-info{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:999px;margin:1px 4px 1px 0;white-space:nowrap}
.pill-good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.pill-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill-info{color:var(--accent3);background:color-mix(in srgb,var(--accent3) 14%,transparent)}
.catchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px 2px 7px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
button.catchip{cursor:pointer}
button.catchip:hover{border-color:var(--accent)}

/* tables */
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--hover)}
td.num,th.num{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;border-bottom:0}
td .sub{display:block;font-size:11.5px;color:var(--muted);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--good)}
.tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 12px}
.tools .grow{flex:1;min-width:200px}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 24px -12px var(--accent2)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.check{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;cursor:pointer}

/* data page */
.drop{border:2px dashed var(--line2);border-radius:18px;padding:34px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--card2)}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card2))}
.drop .big-ic{font-size:34px}
.drop b{display:block;font-size:15px;margin:6px 0 2px}
.files{display:grid;gap:6px;margin:12px 0}
.file{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.file .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
pre.log{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:340px;overflow:auto;margin:12px 0 0}
.steps{margin:0;padding-left:20px;color:var(--ink2);font-size:13px;display:grid;gap:6px}
.steps b{color:var(--ink)}
code{font:12px ui-monospace,Consolas,monospace;background:var(--card2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}

/* review */
.rv{display:grid;grid-template-columns:36px 1fr auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* dialog, tooltip, toast */
dialog{border:1px solid var(--line2);border-radius:22px;background:var(--card);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,8,16,.55);backdrop-filter:blur(3px)}
.dlg{padding:22px 24px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:18px;letter-spacing:-.01em}
.dlg label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.dlg fieldset{border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;gap:8px}
.dlg legend{font-size:12px;font-weight:650;color:var(--muted);padding:0 6px}
.dlg .radio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:500;color:var(--ink)}
.dlg .radio input[type=text]{flex:1;min-width:140px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tipbg);color:var(--tipink);border-radius:12px;padding:9px 12px;font-size:12px;max-width:300px;box-shadow:0 12px 32px -10px rgba(0,0,0,.45)}
#tip .tv{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#tip .tl{opacity:.75}
.toast{position:fixed;right:22px;bottom:22px;z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:420px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
footer{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}

@media (max-width:1180px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}.c6{grid-column:span 12}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;z-index:30;height:auto;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 0}.brand div,.side-foot .privacy{display:none}
  .nav{flex-direction:row}.nav a{padding:8px 10px}.nav a span.t{display:none}
  .side-foot{margin:0 0 0 auto}
  main{padding:0 16px 48px}.topbar{position:static}
  .c3,.c2{grid-column:span 12}
  .hrow{grid-template-columns:30px minmax(70px,40%) 1fr 80px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>harcamalarım</b><small id="mode"></small></div></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="side-foot">
      <button class="themebtn" id="theme" type="button"></button>
      <div class="privacy"><b>🔒 Stays on this PC.</b><br>No cloud, no tracking. The page works offline.</div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <div class="tb-title"><h1 id="pageTitle" class="display"></h1><div class="tb-sub" id="pageSub"></div></div>
      <div class="period" id="periodBox">
        <div class="pills" id="presets" role="group" aria-label="Period"></div>
        <select id="single" aria-label="Pick a month"></select>
        <span id="customBox" hidden><select id="from" aria-label="From"></select> – <select id="to" aria-label="To"></select></span>
      </div>
    </header>
    <section class="page" data-page="overview"></section>
    <section class="page" data-page="categories"></section>
    <section class="page" data-page="merchants"></section>
    <section class="page" data-page="rhythm"></section>
    <section class="page" data-page="cards"></section>
    <section class="page" data-page="friends"></section>
    <section class="page" data-page="transactions"></section>
    <section class="page" data-page="review"></section>
    <section class="page" data-page="data"></section>
    <footer id="foot"></footer>
  </main>
</div>

<dialog id="dlg">
  <form class="dlg" id="dlgForm" method="dialog">
    <h3>Categorize</h3>
    <div class="hint" id="dlgDesc" style="margin:0"></div>
    <label>Merchant name <input id="fMerch" required maxlength="80"></label>
    <label>Category <select id="fCat"></select></label>
    <label id="newCatBox" hidden>New category <input id="fNewCat" maxlength="60" placeholder="e.g. Education"></label>
    <label>Subcategory <input id="fSub" list="subList" maxlength="60" placeholder="e.g. Coffee"><datalist id="subList"></datalist></label>
    <fieldset>
      <legend>Apply to</legend>
      <label class="radio"><input type="radio" name="scope" value="rule" checked> every transaction containing <input type="text" id="fMatch" maxlength="80"></label>
      <div class="small" id="matchCount"></div>
      <label class="radio"><input type="radio" name="scope" value="one"> only this one transaction</label>
    </fieldset>
    <div class="small" id="dlgNote"></div>
    <div class="dlg-actions"><button class="btn" value="cancel" type="button" id="dlgCancel">Cancel</button><button class="btn primary" type="submit" id="dlgSave">Save &amp; rebuild</button></div>
  </form>
</dialog>
<div id="tip" role="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const D = /*__DATA__*/null;
const APP = /*__APP__*/null;   // filled in by app.py when served locally; null when the file is opened directly

/* ───────── helpers ───────── */
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k === "style") e.style.cssText = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
  return e;
};
const rc = (node, ...kids) => node.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
const nf0 = new Intl.NumberFormat("tr-TR", {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat("tr-TR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const nf2 = new Intl.NumberFormat("tr-TR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const tl = v => nf0.format(Math.round(v)) + " ₺";
const tl2 = v => nf2.format(v) + " ₺";
const pct = v => (isFinite(v) ? nf0.format(Math.round(v * 100)) : "–") + "%";
const kfmt = v => Math.abs(v) >= 1e6 ? nf1.format(v / 1e6) + "M" : Math.abs(v) >= 1000 ? nf0.format(v / 1000) + "k" : nf0.format(v);
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const mLabel = m => MN[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const mShort = m => MN[+m.slice(5, 7) - 1];
const dLabel = d => d.slice(8, 10) + "." + d.slice(5, 7) + "." + d.slice(0, 4);
const dShort = d => d.slice(8, 10) + "." + d.slice(5, 7);
const dNice = d => +d.slice(8, 10) + " " + MN[+d.slice(5, 7) - 1];
const wdOf = d => (new Date(d + "T00:00:00").getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const sum = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
const groupSum = (a, key, val = x => x.amt) => { const m = new Map(); for (const x of a) { const k = key(x); m.set(k, (m.get(k) || 0) + val(x)); } return m; };
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), i = s.length >> 1; return s.length % 2 ? s[i] : (s[i - 1] + s[i]) / 2; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const TRMAP = {"İ":"I","ı":"i","Ş":"S","ş":"s","Ğ":"G","ğ":"g","Ü":"U","ü":"u","Ö":"O","ö":"o","Ç":"C","ç":"c"};
const fold = s => (s || "").replace(/[İıŞşĞğÜüÖöÇç]/g, c => TRMAP[c]).toUpperCase();
const initials = s => { const w = (s || "?").replace(/[^\p{L}\p{N} ]/gu, " ").trim().split(/\s+/); return ((w[0] || "?")[0] + (w[1] ? w[1][0] : (w[0] || "")[1] || "")).toUpperCase(); };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ───────── categories: colours & icons ───────── */
const CAT_COLORS = {"Food & Dining":"#FF7A45","Groceries":"#34D399","Transport":"#FACC15","Shopping":"#FF4F9A","Travel":"#22D3EE",
  "Subscriptions & Digital":"#A78BFA","Bills & Utilities":"#A3E635","Health":"#FB7185","Entertainment":"#E879F9",
  "People (IBAN)":"#FDBA74","Cash":"#2DD4BF","Bank Fees & Interest":"#F87171","Government & Taxes":"#94A3B8","Other":"#9A93A8"};
const FALLBACK = ["#F59E0B","#10B981","#EC4899","#8B5CF6","#06B6D4","#84CC16","#F43F5E","#14B8A6","#EAB308","#D946EF"];
const CAT_ICONS = [[/food|dining|restaurant/i,"🍽️"],[/grocer|market/i,"🛒"],[/transport/i,"🚇"],[/shop/i,"🛍️"],[/travel|trip/i,"✈️"],
  [/subscri|digital/i,"📺"],[/bill|utilit/i,"💡"],[/health/i,"💊"],[/entertain|fun/i,"🎟️"],[/people|friend/i,"🫂"],[/cash/i,"💵"],
  [/fee|interest|bank/i,"🏦"],[/gov|tax/i,"🏛️"],[/educat|school/i,"🎓"],[/home|rent/i,"🏠"],[/gift/i,"🎁"],[/pet/i,"🐾"],[/dessert|sweet/i,"🍮"]];
const hash = s => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
const catColor = c => CAT_COLORS[c] || FALLBACK[hash(c || "") % FALLBACK.length];
const catIcon = c => (CAT_ICONS.find(([r]) => r.test(c)) || [0, "📦"])[1];
const INCOME_TYPES = new Set(["Income", "Other income", "Family support"]);
const NON_CATS = new Set(["Transfers & Payments", "Cash Advance", "Income", "Investments"]);

/* ───────── tooltip & toast ───────── */
const tip = $("#tip");
function showTip(e, lines) {
  if (!lines || !lines.length) return;
  tip.replaceChildren(...lines.map((ln, i) => el("div", {class: i ? "tl" : "tv", text: ln})));
  tip.hidden = false;
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const showTipAt = (node, lines) => { const b = node.getBoundingClientRect(); showTip({clientX: b.left + b.width / 2, clientY: b.top}, lines); };
const hideTip = () => { tip.hidden = true; };
const tipOn = (node, lines, onEnter, onLeave) => {
  node.addEventListener("pointermove", e => showTip(e, typeof lines === "function" ? lines() : lines));
  node.addEventListener("pointerenter", () => onEnter && onEnter());
  node.addEventListener("pointerleave", () => { hideTip(); onLeave && onLeave(); });
  return node;
};
let toastT;
function toast(text, busy, ms = 3200) {
  const t = $("#toast"); clearTimeout(toastT);
  rc(t, busy ? el("span", {class: "spin"}) : null, el("span", {text}));
  t.hidden = false;
  if (!busy) toastT = setTimeout(() => { t.hidden = true; }, ms);
}

/* ───────── chart primitives ───────── */
function niceStep(range, count) { const raw = range / count, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function ticks(lo, hi, count = 4) {
  if (hi === lo) hi = lo + 1;
  const step = niceStep(hi - lo, count), a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
const emptyNote = (host, text) => host.replaceChildren(el("div", {class: "empty", text: text || "Nothing in this period."}));
const W_ = host => Math.max(260, host.clientWidth || 600);

/* stacked columns. cols: [{label, parts:[{name,v,color}], faded, tip}] */
function columns(host, cols, opt = {}) {
  if (!cols.length || cols.every(c => !c.parts.some(p => p.v))) return emptyNote(host, opt.empty);
  const W = W_(host), H = opt.height || 230, m = {l: 42, r: 8, t: 18, b: 26};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const pos = cols.map(c => sum(c.parts.filter(p => p.v > 0), p => p.v)), neg = cols.map(c => sum(c.parts.filter(p => p.v < 0), p => p.v));
  const tk = ticks(Math.min(0, ...neg), Math.max(0, ...pos, opt.avg || 0)), y0 = tk[0], y1 = tk[tk.length - 1];
  const Y = v => m.t + ih - (v - y0) / (y1 - y0) * ih;
  const svg = sv("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opt.label || "chart"});
  for (const v of tk) {
    svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: v === 0 ? "axis" : "gridl"}));
    svg.append(sv("text", {x: m.l - 7, y: Y(v) + 4, "text-anchor": "end", class: "tick"}, kfmt(v)));
  }
  const band = iw / cols.length, bw = Math.max(2, Math.min(opt.maxBar || 26, band * 0.72)), r = Math.min(4, bw / 3);
  const every = Math.max(1, Math.ceil(cols.length / Math.max(1, Math.floor(iw / (opt.labelW || 42)))));
  const g = sv("g");
  svg.append(g);
  cols.forEach((c, i) => {
    const cx = m.l + band * i + band / 2, grp = sv("g", {class: "seg", opacity: c.faded ? .38 : 1});
    let up = 0, down = 0;
    const partsSorted = [...c.parts].filter(p => p.v);
    partsSorted.forEach((p, j) => {
      const a = p.v > 0 ? up : down, b = a + p.v;
      if (p.v > 0) up = b; else down = b;
      const yA = Y(a), yB = Y(b), top = Math.min(yA, yB), h = Math.max(0.5, Math.abs(yA - yB) - (partsSorted.length > 1 ? 1 : 0));
      grp.append(sv("rect", {x: cx - bw / 2, y: top, width: bw, height: h, rx: r, fill: p.color || "var(--accent)"}));
    });
    g.append(grp);
    const hit = sv("rect", {x: m.l + band * i, y: m.t, width: band, height: ih, class: "hit", tabindex: opt.focus === false ? null : 0});
    tipOn(hit, c.tip, () => { g.classList.add("dim"); grp.classList.add("on"); }, () => { g.classList.remove("dim"); grp.classList.remove("on"); });
    hit.addEventListener("focus", () => { g.classList.add("dim"); grp.classList.add("on"); showTipAt(hit, c.tip); });
    hit.addEventListener("blur", () => { g.classList.remove("dim"); grp.classList.remove("on"); hideTip(); });
    if (opt.onClick) { hit.style.cursor = "pointer"; hit.addEventListener("click", () => opt.onClick(c)); }
    svg.append(hit);
    if (i % every === 0) svg.append(sv("text", {x: cx, y: H - 7, "text-anchor": "middle", class: "tick"}, c.label));
  });
  if (opt.avg) {
    svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: Y(opt.avg), y2: Y(opt.avg), stroke: "var(--ink)", "stroke-dasharray": "4 4", "stroke-width": 1.2, opacity: .55, "pointer-events": "none"}));
    svg.append(sv("text", {x: W - m.r, y: Y(opt.avg) - 5, "text-anchor": "end", class: "vlabel"}, (opt.avgLabel || "avg") + " " + kfmt(opt.avg)));
  }
  if (opt.peak !== false) {
    const iMax = pos.indexOf(Math.max(...pos));
    if (pos[iMax] > 0) svg.append(sv("text", {x: m.l + band * iMax + band / 2, y: Y(pos[iMax]) - 6, "text-anchor": "middle", class: "vlabel"}, kfmt(pos[iMax])));
  }
  host.replaceChildren(svg);
}

/* line chart. series: [{name, vals:[number|null], color, dash, fill, width}] */
let gradId = 0;
function lines(host, labels, series, opt = {}) {
  const all = series.flatMap(s => s.vals.filter(v => v != null));
  if (!all.length) return emptyNote(host);
  const W = W_(host), H = opt.height || 200, m = {l: 42, r: 12, t: 14, b: 24};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = labels.length;
  const tk = ticks(0, Math.max(...all)), y1 = tk[tk.length - 1];
  const X = i => m.l + (n <= 1 ? iw / 2 : i / (n - 1) * iw), Y = v => m.t + ih - v / y1 * ih;
  const svg = sv("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opt.label || "chart"});
  const defs = sv("defs"); svg.append(defs);
  for (const [a, b] of opt.shade || []) {
    svg.append(sv("rect", {x: X(a) - (a ? iw / (n - 1) / 2 : 0), y: m.t, width: Math.max(2, X(b) - X(a) + iw / Math.max(1, n - 1) / 2), height: ih, fill: "var(--line)"}));
  }
  for (const v of tk) {
    svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: v === 0 ? "axis" : "gridl"}));
    svg.append(sv("text", {x: m.l - 7, y: Y(v) + 4, "text-anchor": "end", class: "tick"}, kfmt(v)));
  }
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 48))));
  labels.forEach((l, i) => { if (i % every === 0) svg.append(sv("text", {x: X(i), y: H - 6, "text-anchor": "middle", class: "tick"}, l)); });
  for (const s of series) {
    let d = "", area = "", first = null, last = null;
    s.vals.forEach((v, i) => {
      if (v == null) return;
      d += (d ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1);
      if (first == null) first = i; last = i;
    });
    if (!d) continue;
    if (s.fill) {
      const id = "lg" + (++gradId);
      const lg = sv("linearGradient", {id, x1: 0, y1: 0, x2: 0, y2: 1});
      lg.append(sv("stop", {offset: "0%", "stop-color": s.color, "stop-opacity": .35}), sv("stop", {offset: "100%", "stop-color": s.color, "stop-opacity": 0}));
      defs.append(lg);
      area = d + `L${X(last).toFixed(1)},${Y(0)}L${X(first).toFixed(1)},${Y(0)}Z`;
      svg.append(sv("path", {d: area, fill: `url(#${id})`}));
    }
    svg.append(sv("path", {d, fill: "none", stroke: s.color, "stroke-width": s.width || 2.4, "stroke-dasharray": s.dash || null, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: s.opacity || 1}));
    if (s.endDot && last != null) {
      svg.append(sv("circle", {cx: X(last), cy: Y(s.vals[last]), r: 4.5, fill: s.color, stroke: "var(--card)", "stroke-width": 2}));
    }
  }
  const cross = sv("line", {y1: m.t, y2: m.t + ih, stroke: "var(--line2)", "stroke-width": 1, visibility: "hidden"});
  svg.append(cross);
  const hit = sv("rect", {x: m.l, y: m.t, width: iw, height: ih, class: "hit"});
  hit.addEventListener("pointermove", e => {
    const b = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - b.left - m.l) / iw * (n - 1))));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("visibility", "visible");
    showTip(e, opt.tip ? opt.tip(i) : [labels[i], ...series.map(s => s.name + ": " + (s.vals[i] == null ? "–" : tl(s.vals[i])))]);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  svg.append(hit);
  host.replaceChildren(svg);

function catTotals(c) { return [...groupSum(c.spend, t => t.cat).entries()].sort((a, b) => b[1] - a[1]); }
function merchStats(rows) {

  for (const t of rows) {
    if (t.cat === "People (IBAN)" || t.cat === "Cash") continue;
    const r = m.get(t.merch) || {name: t.merch, cat: t.cat, total: 0, visits: 0, first: t.d, last: t.d, amts: []};
    r.total += t.amt;
    if (t.type === "Purchase") { r.visits++; r.amts.push(t.amt); }
    if (t.d < r.first) r.first = t.d; if (t.d > r.last) r.last = t.d;
    m.set(t.merch, r);

}

  const byM = new Map();

  const out = [];

/* ── Friends ── */
function pFriends() {
  const fr = new Map();

    r.n++; r.list.push(t); fr.set(t.merch, r);

  const rows = [...fr.values()].sort((a, b) => (b.sent + b.back) - (a.sent + a.back));
  const sent = sum(rows, r => r.sent), back = sum(rows, r => r.back);
  const stat = (l, v, s) => el("div", {}, el("div", {class: "l", text: l}), el("div", {class: "v display", text: v}), el("div", {class: "s", text: s}));

    stat("Net", tl(sent - back), sent ? pct(back / sent) + " came back" : ""), stat("People", nf0.format(rows.length), `${sum(rows, r => r.n)} transfers`)));
  const maxV = Math.max(1, ...rows.map(r => Math.max(r.sent, r.back)));

    el("div", {class: "htrack", title: "paid back"}, el("div", {class: "hfill", style: `right:0;width:${r.back / maxV * 100}%;background:var(--good)`})),
    el("div", {class: "htrack", title: "sent"}, el("div", {class: "hfill", style: `left:0;width:${r.sent / maxV * 100}%;background:#FDBA74`})),

  const bal = card("c7", "Who owes whom", "Green, left = they paid you back · peach, right = you sent them money · number = net.", rows.length ? div : el("div", {class: "empty", text: "No money moved with friends in this period."}));

/* ── Transactions ── */
function pTransactions() {

  const exportBtn = el("button", {class: "btn sm", type: "button", text: "⬇ CSV", title: "Download these rows as a CSV file", onclick: () => {
    const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = ["date,merchant,category,subcategory,card,amount_try,description", ...rows.map(t => [t.d, t.merch, t.cat, t.sub, t.card, t.amt.toFixed(2), t.desc].map(esc).join(","))].join("\n");

  const info = el("div", {class: "small", style: "margin:-4px 0 10px", text: `${nf0.format(rows.length)} rows · ${tl(sum(rows.filter(t => t.sp === 1), t => t.amt))}` + (APP ? " · click a category to change it" : "")});
  const tbl = H_(h => table(h, [

    {label: "Category", sort: "cat", render: t => el("div", {}, catChip(t.cat, APP && t.sp === 1 ? () => openCat(t) : null), el("span", {class: "sub", text: t.sub}))},

      if (t.rev === "check") s.append(pill("warn", "guessed")); if (t.rev === "unknown") s.append(pill("bad", "unknown"));
      if (t.rot) s.append(pill("info", "↔ other card")); if (t.tag) s.append(pill("info", "✈ " + t.tag)); if (INCOME_TYPES.has(t.type)) s.append(pill("good", "money in")); return s; }},
    {label: "Amount", sort: "amt", num: true, cls: t => t.amt < 0 ? "neg" : "", render: t => tl2(INCOME_TYPES.has(t.type) ? -t.amt : t.amt)}],

    el("b", {text: "…or drop files here", style: "margin:0"}), el("div", {class: "small", text: "They're copied into the folder above. Nothing leaves your PC."}));
  drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); });

  const folderRow = el("div", {style: "display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 14px"},
    el("span", {style: "font-size:22px", text: "📁"}), el("code", {text: APP.folder || "Belgeler", style: "font-size:13px;padding:5px 10px;user-select:all"}),
    el("button", {class: "btn sm", type: "button", text: "Open folder", onclick: () => post("/api/open-folder", {})}),
    el("button", {class: "btn sm", type: "button", text: "↻ Refresh list", onclick: loadFiles}));
  const up = card("c7", "Your statements folder", APP.demo ? "DEMO mode — this is the demo folder, not your real one." :
    "Put card statements (PDF) and account exports (PDF / XLSX) from Garanti, QNB and Ziraat here — any names, subfolders are fine, overlaps are fine. Then press Import.",
    folderRow, el("div", {style: "display:flex;gap:8px;flex-wrap:wrap"}, importBtn, el("button", {class: "btn", type: "button", text: "Rebuild dashboard", onclick: () => act("/api/rebuild", {}, "Rebuilding…")})),
    log, fileBox, drop, input);
  mount("data", grid(up, src), grid(privacy));
}

/* ───────── app actions ───────── */
async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"X-Token": APP.token, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json().catch(() => ({ok: false, log: "HTTP " + r.status}));
}
async function act(path, body, msg) {
  toast(msg, true);
  try {
    const j = await post(path, body);
    if (j.ok) { toast("Done ✓ — reloading"); setTimeout(() => location.reload(), 700); }
    else { toast("Something went wrong — details in the Data page log", false, 6000); store.set("lastLog", j.log || ""); }
  } catch (e) { toast("Couldn't reach the app — is its window still open?", false, 6000); }
}
let dlgTx = null;
function suggestedMatch(t) {
  const words = fold(t.desc).replace(/[^A-Z0-9*. ]/g, " ").split(/\s+/).filter(w => w.length > 1 && !/^\d+$/.test(w));
  return words.slice(0, 2).join(" ");
}
async function confirmSuggestion(t) {
  const match = suggestedMatch(t);
  if (match.length < 3) { openCat(t); return; }
  await act("/api/categorize", {id: t.id, merchant: t.merch, category: t.cat, subcategory: t.sub || "General", scope: "rule", match}, "Confirming bank suggestion…");
}
function openCat(t) {
  dlgTx = t;
  const cats = [...new Set([...Object.keys(D.meta.categories || {}), ...catOrder])].filter(c => !NON_CATS.has(c)).sort();
  const fc = $("#fCat");
  fc.replaceChildren(el("option", {value: "", text: "Choose a category…", disabled: true}), ...cats.map(c => el("option", {value: c, text: catIcon(c) + "  " + c})), el("option", {value: "__new", text: "＋ New category…"}));
  fc.value = cats.includes(t.cat) && t.cat !== "Other" ? t.cat : "";
  $("#fMerch").value = t.merch;
  $("#fSub").value = t.sub && t.sub !== "Uncategorized" ? t.sub : "";
  $("#fMatch").value = suggestedMatch(t);
  $("#dlgDesc").textContent = `“${t.desc}” · ${dLabel(t.d)} · ${tl2(t.amt)}` + (t.bankCat ? ` · bank: ${t.bankCat}` : "");
  $("#dlgNote").textContent = APP.demo ? "Demo mode: this changes the demo data only." : "";
  document.querySelector('input[name=scope][value=rule]').checked = true;
  syncDlg();
  $("#dlg").showModal();
}
function syncDlg() {
  const c = $("#fCat").value;
  $("#newCatBox").hidden = c !== "__new";
  const subs = c === "__new" ? [] : [...new Set([...((D.meta.categories || {})[c] || []), ...D.tx.filter(t => t.cat === c).map(t => t.sub)])];
  $("#subList").replaceChildren(...subs.map(s => el("option", {value: s})));
  const words = fold($("#fMatch").value).split(/\s+/).filter(Boolean);
  if (!words.length) { $("#matchCount").textContent = ""; return; }
  const rx = new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+"), "i");
  const n = D.tx.filter(t => rx.test(fold(t.desc))).length;
  $("#matchCount").textContent = `matches ${n} transaction${n === 1 ? "" : "s"} so far (and future ones)`;
}
$("#fCat").addEventListener("change", syncDlg);
$("#fMatch").addEventListener("input", syncDlg);
$("#dlgCancel").addEventListener("click", () => $("#dlg").close());
$("#dlgForm").addEventListener("submit", async e => {
  e.preventDefault();
  let cat = $("#fCat").value; if (cat === "__new") cat = $("#fNewCat").value.trim();
  const scope = document.querySelector("input[name=scope]:checked").value;
  if (!cat) { ($("#fCat").value === "__new" ? $("#fNewCat") : $("#fCat")).focus(); return; }
  if (scope === "rule" && $("#fMatch").value.trim().length < 3) { $("#fMatch").focus(); return; }
  $("#dlg").close();
  await act("/api/categorize", {id: dlgTx.id, merchant: $("#fMerch").value.trim(), category: cat, subcategory: $("#fSub").value.trim(), scope, match: $("#fMatch").value.trim()}, "Saving and rebuilding…");
});

/* ───────── controls & boot ───────── */
function go(page) { if (location.hash !== "#" + page) location.hash = page; else { state.page = page; render(); } }
function fromHash() { const k = location.hash.slice(1); return PAGES.some(p => p[0] === k) ? k : null; }
function buildControls() {
  const seg = $("#presets");
  for (const [key, label] of PRESETS) seg.append(el("button", {type: "button", text: label, "data-k": key, onclick: () => { state.preset = key; store.set("preset", key); render(); }}));
  const single = $("#single"), from = $("#from"), to = $("#to");
  single.append(el("option", {value: "", text: "Pick a month"}));
  for (const m of [...months].reverse()) single.append(el("option", {value: m, text: mLabel(m)}));
  for (const m of months) { from.append(el("option", {value: m, text: mLabel(m)})); to.append(el("option", {value: m, text: mLabel(m)})); }
  single.addEventListener("change", () => { if (!single.value) return; state.preset = "single"; state.single = single.value; render(); });
  from.addEventListener("change", () => { state.from = from.value; render(); });
  to.addEventListener("change", () => { state.to = to.value; render(); });
  const th = $("#theme"), modes = ["system", "light", "dark"], ico = {system: "🌓", light: "☀️", dark: "🌙"};
  const apply = m => { if (m === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m); th.replaceChildren(el("span", {text: ico[m]}), "Theme: " + m); };
  let mode = store.get("theme") || "system"; apply(mode);
  th.addEventListener("click", () => { mode = modes[(modes.indexOf(mode) + 1) % 3]; store.set("theme", mode); apply(mode); renderPage(); });
  addEventListener("hashchange", () => { const k = fromHash(); if (k) { state.page = k; store.set("page", k); render(); scrollTo({top: 0}); } });
}
$("#mode").replaceChildren(el("span", {class: "dot" + (APP ? " live" : "")}), APP ? (APP.demo ? "app · DEMO data" : "local app") : "offline file");
$("#foot").textContent = `Built ${dLabel(D.meta.built)} · statements from ${mLabel(D.meta.start)} · months before that (and every raw row) live in Harcamalarim.xlsx`;
state.page = fromHash() || store.get("page") || "overview";
buildControls();
render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderPage, 160); });
</script>
</body>
